<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cross-Platform Cybersecurity Threat Intelligence Dashboard — Enterprise SOC platform" />
    <meta name="theme-color" content="#050810" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CyberSec" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Cyber Threat Dashboard — ThreatIntel SOC</title>
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #050810;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash-screen img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
        animation: splash-pulse 2s ease-in-out infinite;
      }
      #splash-screen p {
        margin-top: 20px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: #64748b;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen" aria-hidden="true">
      <img src="/icons/icon-192.png" alt="" width="96" height="96" />
      <p>CyberSec</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('load', function () {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          setTimeout(function () {
            splash.classList.add('hidden');
          }, 600);
        }
      });
    </script>
  </body>
</html>
